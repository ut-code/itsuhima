name = "itsuhima"
main = "src/main.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "itsuhima.utcode.net", custom_domain = true }]
workers_dev = false

[dev]
port = 3000

# client のビルド結果を配信。run_worker_first にマッチするパスは Worker へ送る
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# src/main.ts の振り分けと対応させる
run_worker_first = [
  "/",
  "/e/*",
  "/og/*",
  "/api", # "/api/*" は "/api" を含まないため
  "/api/*",
]

[vars]
NODE_ENV = "production"
DOMAIN = "itsuhima.utcode.net"

[[d1_databases]]
binding = "DB"
database_name = "itsuhima-prod"
database_id = "6c6a37d0-e641-44d2-ac96-2e7032333303"
migrations_dir = "migrations"

[env.staging]
name = "itsuhima-staging"
routes = [{ pattern = "itsuhima-staging.utcode.net", custom_domain = true }]
workers_dev = false

[env.staging.vars]
NODE_ENV = "production"
DOMAIN = "itsuhima-staging.utcode.net"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "itsuhima-staging"
database_id = "58fe7064-1e17-4eef-a698-1a156818a835"
migrations_dir = "migrations"
