name = "itsuhima"
main = "src/main.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "itsuhima.utcode.net", custom_domain = true }]
workers_dev = false

[dev]
port = 3000

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/e/*",
  "/og/*",
  "/api", # "/api/*" は "/api" を含まないため
  "/api/*",
]

# 削除してから 7 日たったイベントを消す (src/scheduled.ts)。毎日 18:00 UTC (3:00 JST)
[triggers]
crons = ["0 18 * * *"]

[vars]
NODE_ENV = "production"

# 書き込みの、IP ごとのレート制限 (src/middleware/rateLimit.ts)。数えるのは Cloudflare の拠点ごと。
# namespace_id はアカウントの中で一意な整数。バインディングは env に引き継がれないので、staging にも書く
[[ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "itsuhima-prod"
database_id = "6c6a37d0-e641-44d2-ac96-2e7032333303"
migrations_dir = "migrations"

[env.staging]
name = "itsuhima-staging"
routes = [{ pattern = "itsuhima-staging.utcode.net", custom_domain = true }]
workers_dev = false

[env.staging.vars]
NODE_ENV = "production"
NOINDEX = "true"

[[env.staging.ratelimits]]
name = "WRITE_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "itsuhima-staging"
database_id = "58fe7064-1e17-4eef-a698-1a156818a835"
migrations_dir = "migrations"
